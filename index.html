<!DOCTYPE html>
<html lang="zh-CN" data-scene="s1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请勿倒带 · 工程骨架</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/scenes.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>
<div class="tex"></div>
<div class="wipe"></div>
<div class="wipe-label" id="wipeLabel"></div>
<div class="crt">
  <header class="hud">
    <span class="hud-title">请勿倒带</span>
    <span class="code" id="timecode">00:00:00</span>
  </header>

  <main class="screen">
    <p class="line dim">1997 夏 · 家用录像</p>
    <p class="line">工程骨架已就绪。</p>
    <p class="line dim">这一页不是游戏，是自检页：确认浏览器、编码、相对路径、数据文件都通。</p>

    <div class="choices">
      <button class="choice" id="btn-check">自检：读取 data/script.json</button>
    </div>

    <pre class="log" id="log">等待自检……</pre>

    <p class="footer-note">阶段四 · 无剧情、无引擎。阶段五接入 js/engine.js 后，本页将被真正的标题页替换。<br>
      想看场景主题切换：打开 <a href="preview.html" style="color:inherit">preview.html</a>。</p>
  </main>
</div>

<script>
const logEl = document.getElementById('log');
const tcEl = document.getElementById('timecode');

document.getElementById('btn-check').addEventListener('click', async () => {
  logEl.textContent = '读取中……';
  try {
    const res = await fetch('data/script.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const nodes = (data.nodes || []).length;
    logEl.textContent =
      '✅ 读取成功\n' +
      '剧本节点数：' + nodes + '\n' +
      '起始节点：' + (data.start || '—') + '\n\n' +
      '环境正常，可以进入阶段五。';
  } catch (err) {
    logEl.textContent =
      '❌ 读取失败\n' + err.message + '\n\n' +
      '若是用 file:// 直接双击打开，浏览器会拦截本地 JSON 读取（CORS）。\n' +
      '请改用本地服务器：\n' +
      '  python -m http.server 8000\n' +
      '然后访问 http://localhost:8000';
  }
});

// 时间码走字：纯装饰，用来验证等宽字体与 HUD 位置
let t = 0;
setInterval(() => {
  t = (t + 1) % 43200;
  const h = String(Math.floor(t / 3600)).padStart(2, '0');
  const m = String(Math.floor((t % 3600) / 60)).padStart(2, '0');
  const s = String(t % 60).padStart(2, '0');
  tcEl.textContent = h + ':' + m + ':' + s;
}, 1000);
</script>
</body>
</html>
