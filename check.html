<!DOCTYPE html>
<html lang="zh-CN" data-scene="s1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请勿倒带 · 工程自检</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/scenes.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>
<div class="tex"></div>
<div class="wipe"></div>
<div class="wipe-label" id="wipeLabel"></div>
<div class="crt">
  <header class="hud">
    <span class="hud-title">请勿倒带 · 自检</span>
    <span class="code" id="timecode">00:00:00</span>
  </header>

  <main class="screen">
    <p class="line dim">1997 夏 · 家用录像</p>
    <p class="line">这一页不是游戏，是自检页：确认浏览器、编码、相对路径、数据文件都通。</p>
    <p class="line dim">游戏本体在 <a href="index.html" style="color:inherit">index.html</a>。</p>

    <div class="choices">
      <button class="choice" id="btn-check">自检：读取四份 JSON 并查跳转</button>
    </div>

    <pre class="log" id="log">等待自检……</pre>

    <p class="footer-note">阶段五起，本页退居二线，只在怀疑"数据文件是不是坏了"的时候用。</p>
  </main>
</div>

<script>
const logEl = document.getElementById('log');
const tcEl = document.getElementById('timecode');

document.getElementById('btn-check').addEventListener('click', async () => {
  logEl.textContent = '读取中……';
  try {
    const files = ['data/script.json', 'data/endings.json', 'data/meta.json', 'data/clues.json'];
    const out = [];
    const data = {};
    for (const f of files) {
      const res = await fetch(f, { cache: 'no-store' });
      if (!res.ok) throw new Error(f + ' → HTTP ' + res.status);
      data[f] = await res.json();
      out.push('✅ ' + f + '　' + JSON.stringify(data[f]).length + ' 字节');
    }

    const script = data['data/script.json'];
    const endings = data['data/endings.json'];
    const clues = data['data/clues.json'];
    const nodes = script.nodes || [];
    const ids = new Set(nodes.map(n => n.id));
    const knownScene = new Set(['s0', 's1', 's2', 's3', 's4', 's5', 's6', 's7', 's8']);
    const clueIds = new Set(Object.keys((clues && clues.clues) || {}));

    const bad = [];

    if (!ids.has(script.start)) bad.push('起始节点不存在：' + script.start);

    nodes.forEach(n => {
      if (!knownScene.has(n.scene)) bad.push(n.id + '：场景 ' + n.scene + ' 不在 s0–s8');
      (n.clue || []).forEach(c => {
        if (!clueIds.has(c)) bad.push(n.id + '：线索 ' + c + ' 不在 clues.json');
      });
      (n.route || []).forEach(r => {
        if (!ids.has(r.next)) bad.push(n.id + '：route → ' + r.next + ' 不存在');
      });
      (n.choices || []).forEach(c => {
        const nx = c.next;
        if (nx && !nx.startsWith('#') && !ids.has(nx)) bad.push(n.id + '：“' + c.label + '” → ' + nx + ' 不存在');
        if (c.timeout && !ids.has(c.timeout)) bad.push(n.id + '：timeout → ' + c.timeout + ' 不存在');
      });
    });

    // 反查：哪些节点没有任何入口（除 start）
    const reached = new Set([script.start]);
    nodes.forEach(n => {
      (n.route || []).forEach(r => reached.add(r.next));
      (n.choices || []).forEach(c => { if (c.next && !c.next.startsWith('#')) reached.add(c.next); });
    });
    const orphans = nodes.filter(n => !reached.has(n.id)).map(n => n.id);

    const inScript = new Set(nodes.filter(n => n.ending).map(n => n.ending));
    const endIds = new Set(((endings && endings.endings) || []).map(e => e.id));

    logEl.textContent = out.join('\n') + '\n\n' +
      '剧本节点数：' + nodes.length + '\n' +
      '起始节点：' + (script.start || '—') + '\n' +
      '结局：引擎内 ' + [...inScript].sort().join(' / ') + '　|　endings.json ' + [...endIds].sort().join(' / ') + '\n' +
      '线索：已在用的 ' + [...new Set(nodes.flatMap(n => n.clue || []))].length + ' 条 / 共 ' + clueIds.size + ' 条\n\n' +
      (orphans.length ? '没有入口的节点：' + orphans.join('、') + '\n\n' : '') +
      (bad.length ? '❌ 问题：\n' + bad.join('\n') : '✅ 跳转与线索引用全部通过。');
  } catch (err) {
    logEl.textContent =
      '❌ 读取失败\n' + err.message + '\n\n' +
      '若是用 file:// 直接双击打开，浏览器会拦截本地 JSON 读取（CORS）。\n' +
      '请改用本地服务器：\n' +
      '  python -m http.server 8000\n' +
      '然后访问 http://localhost:8000/check.html';
  }
});

let t = 0;
setInterval(() => {
  t = (t + 1) % 43200;
  const h = String(Math.floor(t / 3600)).padStart(2, '0');
  const m = String(Math.floor((t % 3600) / 60)).padStart(2, '0');
  const s = String(t % 60).padStart(2, '0');
  tcEl.textContent = h + ':' + m + ':' + s;
}, 1000);
</script>
</body>
</html>
